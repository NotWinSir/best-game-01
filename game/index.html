<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23ffb347'/%3E%3C/svg%3E">
<title>Emberwyrm — coil, crush, bring back the dawn</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b12; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;
    background: #0d0b12;
    cursor: crosshair;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberwyrm game stage"></canvas>
<p id="status" class="visually-hidden" role="status"></p>
<script type="module" src="src/main.js"></script>
</body>
</html>
